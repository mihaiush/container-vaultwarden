name: Build and Push Docker Image (amd64)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
   
jobs:
  call-docker-publish:
    uses: mihaiush/ci/.github/workflows/docker-publish.yml@main
    with:
      dockervars: |
       TAG=$(awk -F':' '/FROM /{print $2}' Dockerfile) 
